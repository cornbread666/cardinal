<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blitz</title>

    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <div id="intro">
        <h1>
            Dutch Blitz
        </h1>
        <div class="option" id="player_count">
            Players:
            <input type="number" id="player_count_input" min="2" max="8" step="1" value="4" class="game_info_input"/>
        </div>
        <div class="option" id="goal_score">
            Goal:
            <input type="number" id="goal_score_input" min="1" max="999" step="1" value="75" class="game_info_input"/>
        </div>
        <div id="dancing_div">
            <div class="dancing_png" id="boy_dancing"></div>
            <button class="game_button" id="start_button" onclick="startGame()">Begin</button>
            <div class="dancing_png" id="girl_dancing"></div>
        </div>
        
    </div>

    <div id="game">
        <table id="game_table"></table>

    </div>
    
    <script src="js/main.js"></script>
</body>
</html>
